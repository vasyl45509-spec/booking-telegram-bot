<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий Web App</title>

    <!-- Підключаємо бібліотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #2481cc;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Вітаю у моєму Web App! 👋</h2>
    <button onclick="showMessage()">Натисни мене</button>

    <script>
        // Ініціалізуємо Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо вікно

        function showMessage() {
            // Спливаюче сповіщення всередині Telegram
            tg.showAlert("Привіт! Це твоє перше спливаюче вікно!");
        }
    </script>

</body>
</html>
